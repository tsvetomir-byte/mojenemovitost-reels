name: Instagram MIRROR Reel (2x daily)

on:
  schedule:
    # about 10:40 and 16:40 Europe/Prague (winter and summer time; the script checks the Prague hour)
    - cron: "40 8,9 * * *"
    - cron: "40 14,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the video, do not publish (1 = yes)"
        default: "1"
      force:
        description: "Ignore the time check (1 = yes)"
        default: "1"
      test_type:
        description: "Test type even without a new post: prodejni / anketa / rano / kratky (empty = real check)"
        default: ""

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests pillow
          mkdir -p fonts
          curl -sL -o fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          curl -sL -o fonts/Poppins-Medium.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Medium.ttf
      - {name: Get Suno music, env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}, run: "gh release download music -D music -p '*.mp3' --clobber || echo no-music"}
      - name: Check watched profile, build and publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
          TEST_TYPE: ${{ github.event.inputs.test_type || '' }}
        run: python mirror_reels.py
      - name: Keep the video of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-reel-video
          path: final.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Save lists
        if: success()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git pull --rebase -q || true
          git add posted.json mirror_seen.json 2>/dev/null || true
          git commit -m "mirror $(date -u +%F-%H%M)" || echo "nothing to commit"
          git push
